<text x="170" y="1073" font-family="DejaVu Sans" font-size="28px" font-weight="700" fill="#F2F5FA" text-anchor="start">PERSISTENCE: re-arms from the ledger on restart, never from RAM (Pi forks tear extensions down)</text>
<rect x="140" y="1245" width="2100" height="225" rx="22" fill="#10141F" stroke="#A78BFA" stroke-width="3" stroke-dasharray="12 9"/>
<text x="170" y="1293" font-family="DejaVu Sans" font-size="30px" font-weight="700" fill="#F2F5FA" text-anchor="start">STILL OPEN</text>
<text x="170" y="1338" font-family="DejaVu Sans" font-size="24px" font-weight="400" fill="#9AA3B5" text-anchor="start">poll interval and fairness across many cells</text>
<text x="170" y="1380" font-family="DejaVu Sans" font-size="24px" font-weight="400" fill="#9AA3B5" text-anchor="start">how a thousand holds are presented as one field</text>
